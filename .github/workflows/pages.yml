name: web demo (GitHub Pages)
# Builds web/ into a static site and publishes it to GitHub Pages.
# The 46 MB ONNX policy is not in git: it is attached to the release tagged `web-model-v1`
# (gh release create web-model-v1 web/models/pixelgrasp_k8.onnx) and downloaded here.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: node tools/vendor.mjs
        working-directory: web
      - name: physics parity vs gymnasium-robotics reference
        run: node test/parity.mjs
        working-directory: web
      - name: fetch trained policy
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download web-model-v1 --pattern pixelgrasp_k8.onnx --dir web/models --clobber
      - name: assemble site
        run: |
          mkdir -p _site
          cp -r web/index.html web/style.css web/js web/assets web/models web/vendor _site/
          rm -rf _site/assets/../test
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
